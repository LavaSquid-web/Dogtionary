<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <h1></h1>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dogtionary - 20 Dog Breeds</title>
  <link rel="stylesheet" href="style.css">
   
 <style>
    
    :root {
      --primary: #10b981;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    .navbar {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box input {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 99px;
      width: 280px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    /* Container & Layout */
    .container {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 24px;
      width: 100%;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    #breedCount {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .breed-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .breed-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .img-wrapper {
      height: 200px;
      background: #000;
      overflow: hidden;
    }

    .breed-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .breed-card:hover img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-body h3 {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .card-body p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .profile-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .breed-card:hover .profile-btn {
      background: var(--primary);
      color: #fff;
    }

    /* Modal Popup */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 500px;
      border-radius: 20px;
      padding: 24px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.8rem;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-muted);
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal-img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .modal-details-list {
      margin-top: 16px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-details-list li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      font-size: 0.9rem;
    }

    .modal-details-list span:first-child {
      color: var(--text-muted);
    }

    .modal-details-list span:last-child {
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>

      {

        description: "Affectionate, coat-rich lapdogs bred specifically for royal companionship.",
        image: "https://assets.orvis.com/is/image/orvisprd/shih_tzu?wid=1023&src=is($object$:7-3)&qlt=85&resMode=sharp2&op_usm=1.75,0.3,2,0",

        temperament: "Affectionate, Playful, Outgoing, Gentle",
        weight: "4 - 7.5 kg"
      },
      {
        name: "Samoyed",
        description: "Graceful Arctic sled dogs known for dense white coats and smiling faces.",
        image: "https://pet-health-content-media.chewy.com/wp-content/uploads/2024/09/11171226/202106iStock-181956647-scaled-1.jpg",

    document.addEventListener('DOMContentLoaded', () => {
      const dogGrid = document.getElementById('dogGrid');
      const searchInput = document.getElementById('searchInput');
      const dogModal = document.getElementById('dogModal');
      const modalContent = document.getElementById('modalContent');
      const closeModal = document.getElementById('closeModal');
      const breedCount = document.getElementById('breedCount');

      function renderCards(dogs) {
        if (!dogGrid) return;
        dogGrid.innerHTML = '';
        if (breedCount) breedCount.textContent = `Showing ${dogs.length} breeds`;

        dogs.forEach((dog) => {
          const card = document.createElement('div');
          card.className = 'breed-card';
          card.innerHTML = `
            <div class="img-wrapper">
              <img src="${dog.image}" alt="${dog.name}" loading="lazy">
            </div>
            <div class="card-body">
              <h3>${dog.name}</h3>
              <p>${dog.description}</p>
              <button type="button" class="profile-btn">View Details</button>
            </div>
          `;

          card.addEventListener('click', () => {
            if (!modalContent || !dogModal) return;
            modalContent.innerHTML = `
              <img src="${dog.image}" class="modal-img" alt="${dog.name}">
              <h2>${dog.name}</h2>
              <p style="margin: 8px 0; color: var(--text-muted);">${dog.description}</p>
              <ul class="modal-details-list">
                <li><span>Origin</span><span>${dog.origin}</span></li>
                <li><span>Lifespan</span><span>${dog.lifespan}</span></li>
                <li><span>Temperament</span><span>${dog.temperament}</span></li>
                <li><span>Weight</span><span>${dog.weight}</span></li>
              </ul>
            `;
            dogModal.classList.add('active');
          });

          dogGrid.appendChild(card);
        });
      }

      if (closeModal && dogModal) {
        closeModal.addEventListener('click', () => dogModal.classList.remove('active'));
        window.addEventListener('click', (e) => {
          if (e.target === dogModal) dogModal.classList.remove('active');
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase().trim();
          const filtered = dogsData.filter(d => 
            d.name.toLowerCase().includes(term) || 
            d.temperament.toLowerCase().includes(term) ||
            d.origin.toLowerCase().includes(term)
          );
          renderCards(filtered);
        });
      }

      renderCards(dogsData);
    });
  </script>
